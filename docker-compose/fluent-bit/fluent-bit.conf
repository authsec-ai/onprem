[SERVICE]
    Flush        1
    Log_Level    info
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# Applications POST their logs here.
[INPUT]
    Name         http
    Listen       0.0.0.0
    Port         8888
    Tag          auth.logs

# Split per tenant so downstream consumers can route on it.
[FILTER]
    Name         rewrite_tag
    Match        auth.logs
    Rule         tenant_id ^(.+)$ tenant.$1 false
    Emitter_Name re_emitted

[OUTPUT]
    Name         stdout
    Match        *
    Format       json_lines
