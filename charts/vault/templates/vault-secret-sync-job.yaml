{{ template "vault.mode" . }}
{{- if ne .mode "external" }}
{{- if .serverEnabled -}}
{{- if .Values.server.vaultInit.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "vault.fullname" . }}-secret-sync
  namespace: {{ include "vault.namespace" . }}
  labels:
    helm.sh/chart: {{ include "vault.chart" . }}
    app.kubernetes.io/name: {{ include "vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      name: {{ template "vault.fullname" . }}-secret-sync
      labels:
        app.kubernetes.io/name: {{ include "vault.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ template "vault.fullname" . }}-init-sa
      containers:
      - name: secret-sync
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "Starting secret sync job..."
          
          # Target namespaces come from values, never hardcoded here.
          TARGET_NAMESPACES="{{ join " " .Values.server.vaultInit.syncNamespaces }}"

          if [ -z "$TARGET_NAMESPACES" ]; then
            echo "server.vaultInit.syncNamespaces is empty -- nothing to sync."
            exit 0
          fi
          
          # Check if source secret exists
          if ! kubectl get secret {{ template "vault.fullname" . }}-credentials -n {{ include "vault.namespace" . }} > /dev/null 2>&1; then
            echo "ERROR: Source secret '{{ template "vault.fullname" . }}-credentials' not found in namespace {{ include "vault.namespace" . }}"
            exit 1
          fi
          
          echo "Source secret found: {{ template "vault.fullname" . }}-credentials"
          
          # Sync to each target namespace
          for NS in $TARGET_NAMESPACES; do
            echo "Syncing to namespace: $NS"
            
            # Ensure namespace exists
            if kubectl get namespace $NS > /dev/null 2>&1; then
              echo "Namespace $NS already exists"
            else
              echo "Creating namespace: $NS"
              kubectl create namespace $NS || echo "Could not create $NS, skipping"
            fi

            # Copy the secret, keeping its release-derived name. The namespace
            # line is dropped rather than rewritten, so this does not depend on
            # matching the source namespace string.
            kubectl get secret {{ template "vault.fullname" . }}-credentials -n {{ include "vault.namespace" . }} -o yaml | \
              sed -e '/^  namespace:/d' \
                  -e '/resourceVersion:/d' \
                  -e '/uid:/d' \
                  -e '/creationTimestamp:/d' \
                  -e '/^  selfLink:/d' | \
              kubectl -n "$NS" apply -f - || echo "Failed to sync to $NS"
            
            echo "✓ Secret synced to namespace: $NS"
          done
          
          echo "================================================"
          echo "Secret sync completed successfully!"
          echo "Synced {{ template "vault.fullname" . }}-credentials to:"
          for NS in $TARGET_NAMESPACES; do
            echo "  - $NS"
          done
          echo "================================================"
{{- end }}
{{- end }}
{{- end }}