apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Namespace }}-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: a232dee6-f5fe-4b0e-9155-e1a053291bdf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-role-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-role
subjects:
- kind: ServiceAccount
  name: {{ .Release.Namespace }}-sa
  namespace: {{ .Release.Namespace }}
