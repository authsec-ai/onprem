    stripe_business_price_id: "price_1TVq09APYmGQW9H0FHNQ5LX5"
    stripe_dpi_price_id: ""
    stripe_on_premises_price_id: ""
    stripe_byoc_price_id: ""

# ---------------------------------------------------------------------------
# ENCRYPTION_KEY for spire-headless (spireheadless.enabled is true, and
# templates/Spire-headless-dep.yaml reads this).
#
# !!! The value below is the placeholder carried in the upstream chart. It
# !!! base64-decodes to "thisisatest-key-for-local-dev". REPLACE IT before this
# !!! environment holds anything real:  openssl rand -base64 32
# ---------------------------------------------------------------------------
encryption:
  key: "CHANGE_ME"
