billingservice:
  enabled: false
  port: 7010
  image:
    repository: docker-repo-public.authnull.com/billing-service
    tag: production
  env:
    jwt_def_secret: "CHANGE_ME"
    jwt_sdk_secret: "CHANGE_ME"
    jwt_secret: "CHANGE_ME"
    gin_mode: "debug"
    auth_manager_url: "http://localhost:7469"
    vault_addr: "http://vault.authsec-vault.svc.cluster.local:8200"
    cors_allow_origin: "http://localhost:3000,https://app.example.com,https://*.example.com"
    stripe_secret_key: ""
    stripe_webhook_secret: ""
    stripe_payg_price_id: "price_1TVueQAPYmGQW9H0T89ozuj3"
    stripe_mau_price_id: "price_1TVu8aAPYmGQW9H0sqeRtzG3"
    stripe_agent_tokens_price_id: "price_1TVuXMAPYmGQW9H0Ab6xpyrg"
    stripe_m2m_price_id: "price_1TVucoAPYmGQW9H055bZfzBA"
    stripe_addon_sso_price_id: "price_1TVum8APYmGQW9H02lu8Utwm"
    stripe_addon_custom_domain_price_id: "price_1TVumLAPYmGQW9H0or4jaYCd"
    stripe_addon_siem_price_id: "price_1TVumZAPYmGQW9H0mDsOvqb3"
    stripe_addon_eu_residency_price_id: "price_1TVuo9APYmGQW9H0II7ODNUK"
    stripe_addon_pki_boundary_price_id: "price_1TVuoNAPYmGQW9H0gLOL3fpY"
    stripe_addon_byok_vault_price_id: "price_1TVuokAPYmGQW9H0zM1KyJQB"
