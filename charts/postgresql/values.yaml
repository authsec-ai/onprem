global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClass: ""
  storageClass: ""
  security:
    allowInsecureImages: true
  postgresql:
    fullnameOverride: ""
    auth:
      postgresPassword: "CHANGE_ME"
      username: "authsec"
      password: "CHANGE_ME"
      database: "authsec"
      replicationPassword: "CHANGE_ME"
      existingSecret: ""
      secretKeys:
        adminPasswordKey: ""
        userPasswordKey: ""
        replicationPasswordKey: ""
    service:
      ports:
        postgresql: ""
  compatibility:
    openshift:
      adaptSecurityContext: auto
      
kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterDomain: cluster.local
extraDeploy: []
commonLabels: {}
commonAnnotations: {}
secretAnnotations: {}
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: "16"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  debug: false

auth:
  enablePostgresUser: true
  postgresPassword: "CHANGE_ME"
  username: "authsec"
  password: "CHANGE_ME"
  database: "authsec"
  replicationUsername: repl_user
  replicationPassword: "CHANGE_ME"
  existingSecret: ""
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password
    replicationPasswordKey: replication-password
  usePasswordFiles: true

architecture: replication

replication:
  synchronousCommit: "off"
  numSynchronousReplicas: 0
  applicationName: my_application

containerPorts:
  postgresql: 5432

audit:
  logHostname: false
  logConnections: false
  logDisconnections: false
  pgAuditLog: ""
  pgAuditLogCatalog: "off"
  clientMinMessages: error
  logLinePrefix: ""
  logTimezone: ""

ldap:
  enabled: false
  server: ""
  port: ""
  prefix: ""
  suffix: ""
  basedn: ""
  binddn: ""
  bindpw: ""
  searchAttribute: ""
  searchFilter: ""
  scheme: ""
  tls:
    enabled: false
  uri: ""

